<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 body { 
           font-family: Arial, sans-serif; 
           padding: 20px; 
  }
 #products-container {
 display: flex;
 flex-wrap: wrap;
 gap: 20px;
 margin-top: 20px;
 }
 .product-card {
 width: 250px;
 border: 1px solid #ccc;
 border-radius: 8px;
 box-shadow: 0 2px 6px rgba(0,0,0,0.15);
 overflow: hidden;
 display: flex;
 flex-direction: column; } .product-card img {
 width: 100%;
 height: 160px;
 object-fit: cover; } .product-details {
 padding: 12px;display: flex;
 flex-direction: column;
 justify-content: space-between; }
 .product-description {
 font-size: 14px;
 margin: 8px 0;
 flex-grow: 1;
 }
 .product_price {
 font-weight: bold;
 color: #2b8a3e;
 margin-bottom: 8px;
 }
 .like-button {
 background: none;
 border: none;
 cursor: pointer;
 font-size: 18px;
 color: #888;
 align-self: flex-start;
 transition: color 0.3s ease;
 }
 .like-button.liked {
 color: #e0245e;
 }
    </style>
</head>
<body>
    <form>
 <h2>Добавить новый товар</h2>

 <label for="product-description">Описание товара:</label><br/>
 <input type="text" id="product-description" placeholder="Введите описание" ><br/><br/>

 <label for="product-price">Цена товара (₽):</label><br/>
 <input type="number" class="product_price" min="0" step="0.01" placeholder="0.00" ><br/><br/>

 <input type="button" id="add-product-btn">Добавить товар</button>

 <div id="products-container"></div>
 <script>
    let q=document.querySelector("#add-product-btn");
    let container=document.querySelector("#products-container");
    let product_description=document.querySelector("#product-description");
    let product_price=document.querySelector(".product_price");
    q.addEventListener("click", ()=>{
        let new_card=document.createElement("article");
        new_card.classList.add("product-card");
        container.append(new_card);

        let card_description=document.createElement("div");
        card_description.innerHTML=product_description.value;
        new_card.append(card_description);
        
        let card_price=document.createElement("div");
        card_price.innerHTML=product_price.value+" руб.";
        card_price.classList.add("product_price");
        new_card.append(card_price);

        let card_like=document.createElement("img");
        card_like.src='/img/1.jpg';
        new_card.append(card_like);        
        card_like.addEventListener("click",()=>{
            card_like.src='/img/2.png';
        })
    })
 </script>
</form>
</body>
</html>
